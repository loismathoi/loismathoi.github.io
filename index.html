<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lois</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #eef2f3;
    --ink: #17262d;
    --muted: #5b6b72;
    --trace: #1f7a8c;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a1f; --ink: #e3ecef; --muted: #8fa1a8; --trace: #4fb3c4; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--ink);
    font: 1.0625rem/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: min(32rem, 100%); }
  h1 { font-size: clamp(2.5rem, 9vw, 4rem); font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
  p { margin-top: 0.75rem; color: var(--muted); }
  svg { display: block; width: 100%; height: 3rem; margin-top: 1.75rem; overflow: visible; }
  path { fill: none; stroke: var(--trace); stroke-width: 2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .flat { stroke: var(--muted); stroke-dasharray: 2 6; opacity: 0.6; }
  .wave { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2.4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .wave { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main>
  <h1>Lois</h1>
  <p>This site is work in progress!</p>
  <svg viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true">
    <path class="flat" d="M0 20 H400"/>
    <path class="wave" d="M0 20 H120 C135 20 140 4 150 4 S165 36 175 36 S190 4 200 4 S215 36 225 36 S240 20 255 20 H400"/>
  </svg>
</main>
</body>
</html>
